<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Poles</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:20px;
}

.card{
    background:white;
    max-width:700px;
    margin:auto;
    padding:24px;
    border-radius:16px;
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
}

h1{
    margin-top:0;
    color:#005A9C;
}

h2{
    margin-top:40px;
    margin-bottom:16px;
    font-size:28px;
}

.selected-banner{
    background:#EEF6FF;
    border-left:4px solid #005A9C;
    padding:12px;
    border-radius:6px;
    margin-bottom:20px;
    font-size:14px;
}

.pole-card{
    background:#F8FAFC;
    border:2px solid #005A9C;
    border-radius:10px;
    padding:16px;
    margin-bottom:20px;
}

.pole-label{
    font-size:12px;
    color:#6B7280;
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:6px;
}

.pole-value{
    font-size:24px;
    font-weight:bold;
    color:#005A9C;
}

.badge{
    display:inline-block;
    margin-top:8px;
    background:#005A9C;
    color:white;
    font-size:12px;
    padding:4px 10px;
    border-radius:20px;
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:6px;
    font-weight:600;
}

.required{
    color:#d71920;
}

input,
textarea{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid #B8C1CC;
    border-radius:6px;
    font-size:15px;
}

input[readonly]{
    background:#f5f5f5;
}

textarea{
    min-height:120px;
    resize:vertical;
}

.counter{
    text-align:right;
    font-size:12px;
    color:#777;
    margin-top:4px;
}

.submit-btn{
    width:100%;
    margin-top:30px;
    padding:16px;
    background:#005A9C;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.submit-btn:hover{
    background:#00457A;
}
</style>
</head>

<body>

<div class="card">

    <h1>⚡ Real Fake Poles</h1>

    <div class="selected-banner">
        The pole below was selected from the map and will be included with this submission.
    </div>

    <div class="pole-card">
        <div class="pole-label">Selected Pole</div>
        <div class="pole-value" id="poleDisplay">No Pole Selected</div>
        <div class="badge">Selected from map</div>
    </div>

    <label>Pole ID</label>
    <input type="text" id="poleId" readonly>

    <label>Comments</label>
    <textarea placeholder="Enter your comments here..."></textarea>

    <h2>Your Details</h2>

    <label>First Name <span class="required">*</span></label>
    <input type="text">
    <div class="counter">0/250</div>

    <label>Surname <span class="required">*</span></label>
    <input type="text">
    <div class="counter">0/250</div>

    <label>Phone Number <span class="required">*</span></label>
    <input type="text" placeholder="0412 345 678">

    <label>Email Address <span class="required">*</span></label>
    <input type="email">

    <h2>Your Contact Address</h2>

    <label>Unit/Street Number <span class="required">*</span></label>
    <input type="text">
    <div class="counter">0/70</div>

    <label>Street <span class="required">*</span></label>
    <input type="text">
    <div class="counter">0/250</div>

    <label>Suburb <span class="required">*</span></label>
    <input type="text">
    <div class="counter">0/250</div>

    <label>State <span class="required">*</span></label>
    <input type="text" value="NSW">
    <div class="counter">3/250</div>

    <label>Postcode <span class="required">*</span></label>
    <input type="text">
    <div class="counter">0/250</div>

    <button type="submit" class="submit-btn">
        Submit Real Fake Pole
    </button>

</div>

<script>
const params = new URLSearchParams(window.location.search);

const poleId = params.get('pole_id') || '';

document.getElementById('poleId').value = poleId;
document.getElementById('poleDisplay').textContent =
    poleId || 'No Pole Selected';
</script>

</body>
</html>
